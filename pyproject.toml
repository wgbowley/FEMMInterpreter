[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifemm"
version = "0.1.2"
description = "A python library for interpreting FEMM solution files"

readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["FEM", "Parsing", "format", "FEMM"]

authors = [
  { name = "William Bowley", email = "wgrantbowley@gmail.com" },
]
maintainers = [
  { name = "William Bowley", email = "wgrantbowley@gmail.com" },
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
]

[project.urls]
"Homepage" = "https://github.com/wgbowley/ifemm"
"Bug Tracker" = "https://github.com/wgbowley/ifemm/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ifemm"]